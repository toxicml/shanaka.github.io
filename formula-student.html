<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formula Student — Team Gallery</title>

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/custom.css">

  <style>
    body {
      margin: 0;
      background:#0b0f14;
      color:#f9fafb;
      font-family:system-ui,sans-serif;
    }

    header {
      text-align:center;
      padding:2rem 1rem 1rem;
    }
    header h1 { margin-bottom:.4rem; font-size:2rem; }
    header a  { color:#10b981; text-decoration:none; font-weight:600; }

    /* Video Section */
    .video-section {
      text-align:center;
      padding:1.5rem 1rem 2rem;
      background:#111827;
    }
    .video-section h2 {
      margin-bottom:1rem;
      font-size:1.8rem;
      color:#10b981;
    }
    .video-section video {
      max-width:90%;
      width:800px;
      height:auto;
      border-radius:.8rem;
      box-shadow:0 8px 28px rgba(0,0,0,.5);
    }

    /* Gallery as tiles */
    .gallery {
      max-width:1100px;
      margin:2rem auto;
      padding:0 1rem;
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
      gap:1rem;
    }
    .gallery img {
      width:100%;
      height:180px;
      object-fit:cover;
      border-radius:.6rem;
      box-shadow:0 8px 20px rgba(0,0,0,.35);
      transition:transform .2s ease, filter .2s ease;
    }
    .gallery img:hover {
      transform:scale(1.03);
      filter:brightness(1.05);
    }

    footer {
      text-align:center;
      padding:2rem 0;
    }
    .btn-back {
      display:inline-block;
      padding:.7rem 1.2rem;
      border-radius:.6rem;
      color:#fff;
      text-decoration:none;
      font-weight:700;
      background:linear-gradient(135deg,rgba(16,185,129,.3),rgba(16,185,129,.15));
      border:1px solid rgba(16,185,129,.55);
    }
  </style>
</head>

<body>
  <header>
    <h1>Formula Student — Photo Gallery</h1>
    <p><a href="https://falconeracing.lk/" target="_blank" rel="noopener">Visit our Team Website ↗</a></p>
  </header>

  <!-- Video Section -->
  <section class="video-section">
    <h2>Formula Student Bharat 2024</h2>
    <video controls preload="metadata" poster="images/fs-video-thumb.jpg">
      <source src="videos/fs-bharat2024.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <!-- Gallery as Tiles -->
  <main class="gallery">
    <img src="images/fs/fs1.jpg"  alt="FS photo 1">
    <img src="images/fs/fs2.jpg"  alt="FS photo 2">
    <img src="images/fs/fs3.jpg"  alt="FS photo 3">
    <img src="images/fs/fs4.jpg"  alt="FS photo 4">
    <img src="images/fs/fs5.jpg"  alt="FS photo 5">
    <img src="images/fs/fs6.jpg"  alt="FS photo 6">
    <img src="images/fs/fs7.jpg"  alt="FS photo 7">
    <img src="images/fs/fs8.jpg"  alt="FS photo 8">
    <img src="images/fs/fs9.jpg"  alt="FS photo 9">
    <img src="images/fs/fs10.jpg" alt="FS photo 10">
    <img src="images/fs/fs11.jpg" alt="FS photo 11">
    <img src="images/fs/fs12.jpg" alt="FS photo 12">
    <img src="images/fs/fs13.jpg" alt="FS photo 13">
    <img src="images/fs/fs14.jpg" alt="FS photo 14">
    <!-- Add more images up to 20 -->
  </main>

  <footer>
    <a href="index.html" class="btn-back">← Back to Home</a>
  </footer>
</body>
</html>
